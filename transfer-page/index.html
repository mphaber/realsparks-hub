<!doctype html>
<meta charset="utf-8">
<title>Twinnow transfer bundle</title>
<p id="s">Preparing download...</p>
<script src="../twinnow-transfer-staging/zip-data.js"></script>
<script>
try {
  const b64 = window.__zipB64.join("");
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], { type: "application/zip" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "twinnow-transfer.zip";
  document.body.appendChild(a);
  a.click();
  document.getElementById("s").textContent = "Download started: twinnow-transfer.zip";
} catch (e) {
  document.getElementById("s").textContent = "Error: " + e.message;
}
</script>
